[pytest]
# Unit tests only: tests/integration/ holds scripts run by hand against the
# live Docker stack (python tests/integration/day2_test.py before, ...), not
# pytest tests — see docs/testing.md.
testpaths = tests/unit
# Noise from the TestClient dependency chain, not from this project.
filterwarnings =
    ignore:Using `httpx` with `starlette.testclient`
    ignore:The anyio.abc.BlockingPortal alias is deprecated
