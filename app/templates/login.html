{% extends "_auth_layout.html" %}
{% block title %}Đăng nhập{% endblock %}
{% block heading %}Đăng nhập{% endblock %}
{% block body %}
{% if unverified_email %}
<p><a class="btn secondary block" href="/verify-email/resend?email={{ unverified_email|urlencode }}">Gửi lại email xác minh</a></p>
{% endif %}
<form method="post" action="/login" class="stack">
  <label class="field">Username
    <input name="username" required maxlength="50" autocomplete="username" value="{{ username or '' }}" autofocus>
  </label>
  <label class="field">
    <span class="field-row">Mật khẩu <a href="/forgot-password" class="auth-link">Quên mật khẩu?</a></span>
    <input type="password" name="password" required maxlength="200" autocomplete="current-password">
  </label>
  <button class="btn primary block">Đăng nhập</button>
</form>
{% if signup_enabled %}
<p class="auth-switch">Chưa có tài khoản? <a href="/signup">Đăng ký</a></p>
{% endif %}
{% endblock %}
