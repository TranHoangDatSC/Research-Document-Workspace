<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}{% endblock %} · {{ app_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}?v={{ asset_version }}">
  <script src="{{ url_for('static', path='/auth.js') }}?v={{ asset_version }}" defer></script>
</head>
<body class="auth-body">
<main class="auth-page">
  <div class="auth-art" aria-hidden="true">
    <img src="{{ url_for('static', path='/img/login-art.webp') }}" alt="" width="1400" height="1255">
  </div>
  <section class="auth-card">
    <a class="auth-brand" href="/login"><span class="auth-brand-mark">{{ icon('layers', 22) }}</span><strong>{{ app_name }}</strong></a>
    <h1>{% block heading %}{% endblock %}</h1>
    {% if error %}<p class="notice" role="alert">{{ error }}</p>{% endif %}
    {% if notice %}<p class="notice success" role="status">{{ notice }}</p>{% endif %}
    {% block body %}{% endblock %}
  </section>
</main>
</body>
</html>
